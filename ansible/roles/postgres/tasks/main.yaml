- name: Create a database volume
  community.docker.docker_volume:
    name: postgresql_data
    state: present

- name: Creates a directory for storing backups
  ansible.builtin.file:
    path: /backups/postgres
    state: directory

- name: Create a Postgres container
  community.docker.docker_container:
    name: database
    image: postgres:17
    state: started
    mounts:
      - type: volume
        source: postgresql_data
        target: /var/lib/postgresql/data
      - type: bind
        read_only: false
        propagation: shared
        source: /backups/postgres
        target: /backups
    ports:
      - "5432:5432"
    env:
      POSTGRES_PASSWORD: "{{ database_password }}"
      POSTGRES_USER: "{{ database_user }}"
      POSTGRES_DB: "{{ database_name }}"