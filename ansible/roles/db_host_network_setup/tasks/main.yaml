- name: Netcfg
  ansible.builtin.copy:
    dest: /etc/netplan/01-netcfg.yaml
    content: |
      network:
        version: 2
        renderer: networkd
        ethernets:
          enp7s0:
            dhcp4: no
            addresses:
              - 192.168.0.5/28
            routes:
              - to: default
                via: 192.168.0.4
            nameservers:
              addresses:
                - 8.8.8.8
  notify: apply netplan
