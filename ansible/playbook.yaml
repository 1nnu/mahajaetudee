- name: Handle Connection Issues with Retries
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure initial connectivity
      ansible.builtin.wait_for_connection:
        delay: 5
        sleep: 5
        timeout: 300
      
    - name: Check if host has been connected to before
      ansible.builtin.stat:
        path: /cloud_init_has_run
      register: host_ready

    - name: Wait for cloud init and ensure connectivity
      ansible.builtin.wait_for_connection:
        delay: 450 # Wait for cloud init to take effect
        sleep: 10
        timeout: 900
      when: not host_ready.stat.exists

- name: Debug role
  hosts: all
  roles:
    - debug
  gather_facts: true

- name: Initial setup
  hosts: all
  remote_user: root
  roles:
    - init
  tags: init
  gather_facts: true

- name: Install docker
  hosts: all
  remote_user: root
  roles:
    - geerlingguy.docker
  tags: docker
  gather_facts: true

- name: Setup database
  hosts: _node_type_db
  remote_user: root
  roles:
    - postgres
  tags: db
  gather_facts: true