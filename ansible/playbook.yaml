- name: Handle Connection Issues with Retries
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure connectivity
      ansible.builtin.wait_for_connection:
        connect_timeout: 10
        delay: 450 # Wait for cloud init to take effect
        sleep: 10
        timeout: 600

- name: Initial setup
  hosts: all
  remote_user: root
  roles:
    - init
  tags: init
  gather_facts: true
