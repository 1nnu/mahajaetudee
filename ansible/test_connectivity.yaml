- name: Handle Connection Issues with Retries
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure connectivity using Ansible Ping with retries
      ansible.builtin.ping:
      register: ping_result
      retries: 10
      delay: 15
      until: ping_result is succeeded
    - name: Debug ping result
      debug:
        var: ping_result